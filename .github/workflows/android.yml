name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Android SDK y Aceptar Licencias
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x gradlew

      - name: Compilar APK de Depuracion
        run: ./gradlew assembleDebug

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
